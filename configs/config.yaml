augmentation:
  train:
    brightness_contrast: true
    brightness_limit: 0.25
    contrast_limit: 0.25
    gaussian_noise: true
    horizontal_flip: true
    noise_var_limit:
    - 10
    - 65
    rotate90: true
    vertical_flip: true
    elastic_transform: true
    multiplicative_noise: true
    clahe: true
    coarse_dropout: true
  val:
    horizontal_flip: false
checkpointing:
  mode: max
  monitor: iou
  save_best: true
  save_latest: true
data:
  image_size: 512
  num_workers: 0
  pin_memory: true
  sar_log_norm: false
  root_dir: C:\Users\gaura\OneDrive\Desktop\Galaxy Data
logging:
  csv: true
  log_interval: 20
  save_vis_every: 5
  tensorboard: true
loss:
  bce_weight: 0.5
  dice_weight: 0.5
  focal_alpha: 0.25
  focal_gamma: 2.0
  primary: focal_tversky
  tversky_alpha: 0.25
  tversky_beta: 0.75
metrics:
  threshold: 0.99
model:
  activation: null
  architecture: UnetPlusPlus
  classes: 1
  encoder: efficientnet-b3
  encoder_weights: imagenet
  in_channels: 4
optimizer:
  name: adamw
project:
  experiment_dir: experiments
  name: EO-SAR-ChangeDetection
  seed: 42
scheduler:
  T_max: 40
  factor: 0.5
  gamma: 0.5
  min_lr: 1.0e-06
  name: cosine
  patience: 5
  step_size: 10
training:
  batch_size: 8
  early_stopping_patience: 10
  epochs: 40
  gradient_clip: 1.0
  learning_rate: 0.0001
  mixed_precision: true
  num_workers: 0
  weight_decay: 0.0001
